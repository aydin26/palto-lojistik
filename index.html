<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101b2d">
<title>PALTO LOJİSTİK</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f4f8;color:#182438;font-family:Arial,sans-serif}
header{background:#101b2d;color:white;padding:22px}
header h1{margin:0;font-size:24px;letter-spacing:1px}
header p{margin:7px 0 0;color:#bdc9d8}
main{max-width:950px;margin:25px auto;padding:0 15px}
.card{background:white;border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 3px 15px #14243a12}
h2{margin-top:0;font-size:20px}
input,select,textarea{width:100%;padding:12px;margin:7px 0 15px;border:1px solid #ccd4df;border-radius:8px;font-size:15px;background:white}
button{padding:12px 18px;border:0;border-radius:8px;background:#1676d2;color:white;font-size:15px;font-weight:bold;cursor:pointer}
button.secondary{background:#26364d}
button.danger{background:#a52c37}
label{font-weight:bold;font-size:14px}
.hidden{display:none}
.task{border:1px solid #e0e5ec;border-radius:10px;padding:15px;margin:12px 0}
.urgent{border-left:5px solid #dc3545}
.tag{font-size:12px;font-weight:bold;color:#bd2835}
.muted{color:#718096;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}header h1{font-size:21px}}
</style>
</head>
<body>
<header>
<h1>🚚 PALTO LOJİSTİK</h1>
<p>Palto Tasarım · Lojistik Yönetim Sistemi</p>
</header>
<main>
<section id="login" class="card">
<h2>Sisteme Giriş</h2>
<label>E-posta</label>
<input id="email" type="email" placeholder="E-posta adresiniz">
<label>Şifre</label>
<input id="password" type="password" placeholder="Şifreniz">
<button onclick="login()">Giriş Yap</button>
<p id="message" class="muted"></p>
</section>

<section id="app" class="hidden">
<div class="card">
<div class="grid">
<div><b id="welcome">PALTO LOJİSTİK</b><p class="muted" id="role"></p></div>
<div style="text-align:right"><button class="secondary" onclick="logout()">Çıkış</button></div>
</div>
</div>

<section id="requestPanel" class="card hidden">
<h2>Yeni Lojistik Talebi</h2>
<label>Talep eden</label>
<select id="requester"></select>
<div class="grid">
<div><label>Tarih</label><input id="date" type="date"></div>
<div><label>Saat</label><input id="time" type="time"></div>
</div>
<label>Nereden</label><input id="from" placeholder="Örn. Fabrika">
<label>Nereye</label><input id="to" placeholder="Örn. Baran Işık">
<label>Yük / Malzeme</label><input id="cargo" placeholder="Örn. Çek">
<label>Araç ihtiyacı</label>
<select id="preference">
<option>FARKETMEZ</option><option>Minibüs</option><option>Kamyon</option>
</select>
<label>Aciliyet</label>
<select id="urgency"><option>Normal</option><option>Acil</option></select>
<label>Açıklama</label><textarea id="description" rows="3"></textarea>
<button onclick="submitRequest()">Talebi Gönder</button>
<p id="requestMessage" class="muted"></p>
</section>

<section id="adminPanel" class="card hidden">
<h2>Yönetici Paneli</h2>
<div id="tasks"></div>
</section>

<section id="myRequests" class="card hidden">
<h2>Taleplerim</h2>
<div id="ownTasks"></div>
</section>
</section>
</main>

<script>
const SUPABASE_URL = "https://lrehnuasrkyjagovvmzg.supabase.co";
const SUPABASE_KEY = "sb_publishable_kRaSk1kkBEKsSd3C2AGGXw_H1jocQRY";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const names = ["Metin","Mevlüt","Nazlı","Yusuf","Oğulcan","Eda","Umut","Canpolat","Serap","Seda"];

let currentUser=null;
let currentRole=null;

document.getElementById("date").value =
new Date().toLocaleDateString("en-CA");

document.getElementById("requester").innerHTML =
names.map(n=><option>${n}</option>).join("");

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const msg=document.getElementById("message");
 msg.textContent="Giriş yapılıyor...";
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){msg.textContent="Giriş başarısız: "+error.message;return;}
 await startApp(data.user);
}

async function startApp(user){
 currentUser=user;
 const {data:profile,error}=await db.from("profiles")
 .select("full_name,role").eq("id",user.id).single();

 if(error||!profile){alert("Kullanıcı profili bulunamadı.");return;}
 currentRole=profile.role;
 document.getElementById("login").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 document.getElementById("welcome").textContent=profile.full_name;
 document.getElementById("role").textContent="Yetki: "+profile.role;

 document.getElementById("requestPanel").classList.toggle("hidden",
 !["admin","requester"].includes(currentRole));
 document.getElementById("adminPanel").classList.toggle("hidden",
 currentRole!=="admin");
 document.getElementById("myRequests").classList.toggle("hidden",
 currentRole!=="requester");

 if(currentRole==="admin") await loadAdmin();
 if(currentRole==="requester") await loadOwn();
}

async function submitRequest(){
 const msg=document.getElementById("requestMessage");
 msg.textContent="Talep gönderiliyor...";
 const record={
 request_date:document.getElementById("date").value,
 request_time:document.getElementById("time").value||null,
 from_location:document.getElementById("from").value.trim(),
 to_location:document.getElementById("to").value.trim(),
 cargo:document.getElementById("cargo").value.trim(),
 vehicle_preference:document.getElementById("preference").value,
 requester:document.getElementById("requester").value,
 urgency:document.getElementById("urgency").value,
 description:document.getElementById("description").value.trim()||null
 };
 if(!record.request_date||!record.from_location||!record.to_location||!record.cargo){
 msg.textContent="Lütfen zorunlu alanları doldurun.";return;
 }
 const {error}=await db.from("requests").insert(record);
 if(error){msg.textContent="Hata: "+error.message;return;}
 msg.textContent="Talebiniz başarıyla gönderildi!";
 ["from","to","cargo","description"].forEach(id=>document.getElementById(id).value="");
 if(currentRole==="requester") await loadOwn();
}

async function loadOwn(){
 const {data,error}=await db.from("requests").select("*")
 .order("created_at",{ascending:false});
 const box=document.getElementById("ownTasks");
 if(error){box.textContent=error.message;return;}
 box.innerHTML=data.map(taskCard).join("")||"Henüz talep yok.";
}

async function loadAdmin(){
 const [{data:tasks,error},{data:vehicles},{data:drivers}]=await Promise.all([
 db.from("requests").select("*").order("request_date",{ascending:false}),
 db.from("vehicles").select("*").eq("active",true),
 db.from("drivers").select("*").eq("active",true)
 ]);
 const box=document.getElementById("tasks");
 if(error){box.textContent=error.message;return;}
 box.innerHTML=tasks.map(t=>`
 <div class="task ${t.urgency==="Acil"?"urgent":""}">
 ${t.urgency==="Acil"?'<div class="tag">🚨 ACİL</div>':""}
 <b>${escapeHtml(t.from_location)} → ${escapeHtml(t.to_location)}</b>
 <p>${escapeHtml(t.cargo)} · ${escapeHtml(t.requester)}</p>
 <p class="muted">${t.request_date} ${t.request_time||""} · ${escapeHtml(t.status)}</p>
 <label>Araç</label>
 <select id="v${t.id}">
 <option value="">Atanmadı</option>
 ${vehicles.map(v=><option value="${v.id}" ${t.assigned_vehicle_id===v.id?"selected":""}>${escapeHtml(v.name)}</option>).join("")}
 </select>
 <label>Şoför</label>
 <select id="d${t.id}">
 <option value="">Atanmadı</option>
 ${drivers.map(d=><option value="${d.id}" ${t.assigned_driver_id===d.id?"selected":""}>${escapeHtml(d.name)}</option>).join("")}
 </select>
 <label>Durum</label>
 <select id="s${t.id}">
 ${["Bekliyor","Onaylandı","Araç atandı","Yolda","Tamamlandı","İptal edildi"].map(s=><option ${t.status===s?"selected":""}>${s}</option>).join("")}
 </select>
 <button onclick="saveTask(${t.id})">Atamayı / Durumu Kaydet</button>
 </div>`).join("")||"Henüz talep yok.";
}

async function saveTask(id){
 const vehicle=document.getElementById("v"+id).value;
 const driver=document.getElementById("d"+id).value;
 const status=document.getElementById("s"+id).value;
 const {error}=await db.from("requests").update({
 assigned_vehicle_id:vehicle?Number(vehicle):null,
 assigned_driver_id:driver?Number(driver):null,
 status
 }).eq("id",id);
 if(error){alert("Kaydedilemedi: "+error.message);return;}
 alert("Görev güncellendi.");
 await loadAdmin();
}

function taskCard(t){
 return `<div class="task ${t.urgency==="Acil"?"urgent":""}">
 <b>${escapeHtml(t.from_location)} → ${escapeHtml(t.to_location)}</b>
 <p>${escapeHtml(t.cargo)} · ${escapeHtml(t.requester)}</p>
 <p class="muted">${t.request_date} · ${escapeHtml(t.status)}</p>
 ${t.urgency==="Acil"?'<span class="tag">ACİL</span>':""}
 </div>`;
}

function escapeHtml(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

db.auth.getSession().then(({data})=>{
 if(data.session) startApp(data.session.user);
});
</script>
</body>
</html>
